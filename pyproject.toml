[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legion-perf"
dynamic = ["version"]
description = "Extreme Cooling and hardware monitoring for the Lenovo Legion Y720"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["dbus-fast>=2.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
legion-perfd = "legion_perf.daemon:main"

[project.gui-scripts]
legion-perf = "legion_perf.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "legion_perf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях

[tool.ruff.lint.per-file-ignores]
# dbus-fast берёт сигнатуры D-Bus из аннотаций-строк ("b", "as")
"src/legion_perf/daemon.py" = ["F722", "F821"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["legion_perf.daemon"]
# dbus-fast берёт сигнатуры D-Bus из аннотаций-строк ("b", "as")
disable_error_code = ["name-defined", "valid-type", "no-untyped-call"]

[[tool.mypy.overrides]]
# системный PySide6 в Arch ставится без py.typed
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["legion_perf.gui.*"]
disallow_subclassing_any = false
