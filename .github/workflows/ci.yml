name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (dbus-daemon, Qt offscreen runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -v
