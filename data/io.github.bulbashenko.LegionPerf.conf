<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.bulbashenko.LegionPerf"/>
  </policy>
  <!-- Вызывать может любой: права на изменение проверяет демон через polkit -->
  <policy context="default">
    <allow send_destination="io.github.bulbashenko.LegionPerf"/>
  </policy>
</busconfig>
